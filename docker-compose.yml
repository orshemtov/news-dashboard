# Usage: docker compose --env-file .env.docker up -d
# The --env-file flag loads .env.docker for ${POSTGRES_*} variable substitution
# throughout this file, and env_file: .env.docker on the backend service injects
# the vars into the container.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env.docker
    environment:
      # Assembled from POSTGRES_* — no DATABASE_URL duplication in .env.docker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Write Telegram session file into the persistent volume
      TELEGRAM_SESSION_NAME: /app/sessions/news_dashboard
      # Persist media files in a volume
      MEDIA_STORAGE_PATH: /app/media
      # LLM connection (connect to Ollama on host)
      LLM_API_BASE: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist Telegram session file across container restarts
      - telegram_sessions:/app/sessions
      # Persist downloaded media (images/videos) across restarts
      - backend_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; import json; response = urllib.request.urlopen('http://localhost:8000/api/health'); data = json.load(response); exit(0 if data['status'] == 'ok' else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  telegram_sessions:
  backend_media:
