name: Build and Push Docker Images

on:
  push:
    branches:
      - Unraid

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/news-dashboard-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository_owner }}/news-dashboard-frontend
            # VITE_API_BASE_URL defaults to /api (nginx proxies to backend on same origin).
            # For deployments where frontend and backend are on different origins,
            # build locally with: docker build --build-arg VITE_API_BASE_URL=http://host:8000/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
