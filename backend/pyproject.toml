[project]
name = "news-dashboard-backend"
version = "0.1.0"
description = "News aggregator dashboard backend"
readme = "README.md"
authors = [
    { name = "Or Shemtov", email = "oriesh@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.13.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.134.0",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pgvector>=0.4.2",
    "pydantic-ai>=1.63.0",
    "pydantic-settings>=2.13.1",
    "sentence-transformers>=5.2.3",
    "sqlalchemy[asyncio]>=2.0.47",
    "telethon>=1.42.0",
]

[project.scripts]
serve = "app.main:cli"

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
    "ty>=0.0.1a7",
]

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "RUF001", # ambiguous unicode char in string (intentional en-dashes)
    "RUF002", # ambiguous unicode char in docstring
    "RUF003", # ambiguous unicode char in comment
    "TC001",  # move import into TYPE_CHECKING (we don't use TYPE_CHECKING)
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty.environment]
python-version = "3.13"
